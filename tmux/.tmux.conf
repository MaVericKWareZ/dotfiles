# ┌─────────────────────────────────────────────────────────────┐
# │  General / Terminal                                           │
# └─────────────────────────────────────────────────────────────┘
# True color + italics support
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"

set -g mouse on
set -sg escape-time 10          # snappier ESC (no lag in vim)
set -g focus-events on          # let vim/editors react to focus changes
set -g history-limit 50000      # deeper scrollback
set -g display-time 2000        # messages linger a bit longer
set -g set-clipboard on         # use system clipboard

# Keep the server alive when the last session closes its window
set -g detach-on-destroy off

# Reload config
bind r source-file "$HOME/.tmux.conf" \; display-message "  Reloaded ~/.tmux.conf"

# ┌─────────────────────────────────────────────────────────────┐
# │  Prefix (unchanged: Ctrl + a)                                │
# └─────────────────────────────────────────────────────────────┘
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ┌─────────────────────────────────────────────────────────────┐
# │  Windows & Panes                                             │
# └─────────────────────────────────────────────────────────────┘
# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Splits keep the current directory (intuitive | and - mnemonics)
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Repeatable pane resizing (prefix then H/J/K/L, hold to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick maximize / restore the current pane
bind m resize-pane -Z

# ┌─────────────────────────────────────────────────────────────┐
# │  Copy mode (vi-style)                                        │
# └─────────────────────────────────────────────────────────────┘
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind Enter copy-mode            # prefix + Enter to scroll/search
bind P paste-buffer

# ┌─────────────────────────────────────────────────────────────┐
# │  Theme — Catppuccin (mocha), tuned MINIMAL / single-tone    │
# └─────────────────────────────────────────────────────────────┘
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Status layout
set -g status-position top       # bar at the top
set -g status-interval 5         # refresh modules every 5s
set -g status-left-length 100
set -g status-right-length 100

# Window list: number on the left, name beside it
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# --- MINIMAL: one muted grey everywhere instead of catppuccin's rainbow ---
# overlay2 = #9399b2 (light grey pill, dark icon)  | surface0 = #313244 (value bg)
# Window list: muted; current window only slightly brighter (no mauve highlight)
set -g @catppuccin_window_number_color "#6c7086"
set -g @catppuccin_window_current_number_color "#9399b2"

# Every right-side module's icon pill -> the same muted grey
set -g @catppuccin_cpu_color       "#9399b2"
set -g @catppuccin_ram_color       "#9399b2"
set -g @catppuccin_battery_color   "#9399b2"
set -g @catppuccin_date_time_color "#9399b2"
set -g @catppuccin_session_color   "#9399b2"
set -g @catppuccin_directory_color "#9399b2"

# Keep cpu/ram values monotone even under high load: mute the red background AND
# the near-black "crust" text it was paired with (else black-on-dark = unreadable)
set -g @cpu_high_bg_color "#313244"
set -g @ram_high_bg_color "#313244"
set -g @cpu_high_fg_color "#cdd6f4"
set -g @ram_high_fg_color "#cdd6f4"

# Center each icon inside its pill (space both sides -> glyph sits centered)
set -g @catppuccin_directory_icon "  "
set -g @catppuccin_cpu_icon "  "
set -g @catppuccin_ram_icon "  "
set -g @catppuccin_battery_icon " #{l:#{battery_icon}} "
set -g @catppuccin_date_time_icon " 󰃰 "
set -g @catppuccin_session_icon "  "

# Subtle separators
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "icon"

# ┌─────────────────────────────────────────────────────────────┐
# │  Plugins (TPM)                                              │
# └─────────────────────────────────────────────────────────────┘
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save & restore sessions
set -g @plugin 'tmux-plugins/tmux-yank'        # system-clipboard copy
set -g @plugin 'tmux-plugins/tmux-cpu'         # cpu + ram percentages
set -g @plugin 'tmux-plugins/tmux-battery'     # battery status
set -g @plugin 'catppuccin/tmux'                # theme (tuned minimal above)

# Resurrect / Continuum: restore on start, autosave every 15 min
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (loads catppuccin + tmux-cpu + tmux-battery)
run '~/.tmux/plugins/tpm/tpm'

# ┌─────────────────────────────────────────────────────────────┐
# │  Status bar assembly (MUST come after `run tpm`)            │
# └─────────────────────────────────────────────────────────────┘
# Plugins are loaded, so catppuccin modules resolve. -F bakes the cpu/ram/battery
# tokens into status-right; re-running cpu.tmux/battery.tmux swaps them for live
# #() calls.
# Left: empty.  Right: dir -> cpu -> ram -> battery -> date/time -> session
set -g status-left ""
set -g status-right  "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_session}"
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
run '~/.tmux/plugins/tmux-battery/battery.tmux'
