# ┌─────────────────────────────────────────────────────────────┐
# │  General / Terminal                                           │
# └─────────────────────────────────────────────────────────────┘
# True color + italics support
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"

set -g mouse on
set -sg escape-time 10          # snappier ESC (no lag in vim)
set -g focus-events on          # let vim/editors react to focus changes
set -g history-limit 50000      # deeper scrollback
set -g display-time 2000        # messages linger a bit longer
set -g set-clipboard on         # use system clipboard

# Keep the server alive when the last session closes its window
set -g detach-on-destroy off

# Reload config
bind r source-file "$HOME/.tmux.conf" \; display-message "  Reloaded ~/.tmux.conf"

# ┌─────────────────────────────────────────────────────────────┐
# │  Prefix (unchanged: Ctrl + a)                                │
# └─────────────────────────────────────────────────────────────┘
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ┌─────────────────────────────────────────────────────────────┐
# │  Windows & Panes                                             │
# └─────────────────────────────────────────────────────────────┘
# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Splits keep the current directory (intuitive | and - mnemonics)
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Alt-<number> to jump straight to a window (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Repeatable pane resizing (prefix then H/J/K/L, hold to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick maximize / restore the current pane
bind m resize-pane -Z

# ┌─────────────────────────────────────────────────────────────┐
# │  Copy mode (vi-style)                                        │
# └─────────────────────────────────────────────────────────────┘
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind Enter copy-mode            # prefix + Enter to scroll/search
bind P paste-buffer

# Mouse-drag / `y` copies to the macOS clipboard but KEEPS the highlight and
# doesn't yank you to the bottom. tmux-yank reads these two options when it binds
# `y` + MouseDragEnd1Pane, so they must sit above `run tpm` further down.
set -g @yank_action 'copy-pipe-no-clear'   # copy, but don't clear/scroll away
set -g @yank_with_mouse 'on'

# Double-click a word, triple-click a line -> select + copy straight to the
# clipboard, whether you're in normal mode or already in copy-mode.
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; send -X copy-pipe-no-clear "pbcopy"
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send -X select-line \; send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear "pbcopy"

# Escape hatch: hold ⌥ Option and drag in iTerm2 for native selection that
# ignores tmux (spans panes, clean wrapped lines) — then ⌘C as usual.

# ┌─────────────────────────────────────────────────────────────┐
# │  Theme / status bar (minimal, single-tone)                   │
# └─────────────────────────────────────────────────────────────┘
# Palette
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BEBC"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

# Status bar layout
set -g status-position top       # bar at the top
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold]  #S #[fg=${gray_light},nobold] | "
set -g status-right " #{cpu}  #{mem} "

set -g window-status-current-format "#[fg=${cyan_soft},bold] #[underscore] #I:#W"
set -g window-status-format " #I:#W"

# Element styles (messages, selection, pane borders)
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${gray_medium}"

set -g status-interval 5         # refresh cpu/mem modules every 5s

# ┌─────────────────────────────────────────────────────────────┐
# │  Plugins (TPM)                                              │
# └─────────────────────────────────────────────────────────────┘
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save & restore sessions
set -g @plugin 'tmux-plugins/tmux-yank'        # system-clipboard copy
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Resurrect / Continuum: restore on start, autosave every 15 min
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

